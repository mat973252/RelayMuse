name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - run: pnpm install --frozen-lockfile
      - name: Expose the pinned Pi CLI to doctor tests
        shell: bash
        run: echo "$GITHUB_WORKSPACE/packages/adapter-pi/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pnpm check
      - run: node examples/crash-demo.mjs
      - run: node examples/pi-muse/demo.mjs
      - run: node scripts/verify-hosts.mjs
